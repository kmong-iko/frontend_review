<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables and Colors</title>
</head>
<!-- Colors -->
<body style="background-color: lightyellow; color: darkblue;">
    
    <h3 style="color: rgb(221, 130, 146)">Store Hours</h3>

    <!-- Table -->
    <table bgcolor="white" border=".5" cellpadding="5" cellspacing="2">
        <tr bgcolor="lightpink"> <!-- Table Row -->
            <th>Day</th> <!-- Table Header -->
            <th>Open</th>
            <th>Close</th>
        </tr>
        <tr bgcolor="lightblue" align-"center"> <!-- Table Row -->
            <td>Monday</td>
            <td>9:00 AM</td>
            <td>6:00 PM</td>
        </tr>
    </table>

         Back to Main Page
    </a>

</body>
</html>
