<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video and Text Formatting</title>
</head>
<body>
    <h1>Welcome to Page 3</h1>
    <hr>
    <p>This is the third page of the HTML review.</p>
   
    <!-- Video element -->
    <video controls muted autoplay width="400" height="300">
        <source src="/html_review/mp4_folder/cheesev1.mp4" type="video/mp4">
        <source src="/mp4_folder/cheesev1.WebM" type="video/webm">
        This browser does not support the video tag.
    </video>
   
    <h1>Text Formatting</h1>
    <!-- Text Formatting-->
    <p>normal text</p>
    <p><b>bold</b> text</p>
    <p><i>italic</i> text</p>
    <p><u>underlined</u> text</p>
    <p><big>big</big> text</p>
    <p><small>small</small> text</p>
    <p><sub>subscript</sub> text</p>
    <p><sup>superscript</sup> text</p>
    <p><ins>inserted</ins> text</p>
    <p><del>deleted</del> text</p>
    <p><mark>marked</mark> text</p>

    <!-- Buttons -->
    <br>
    <a href="index.html" target="_self" title="This takes you back to the main page">
         Back to Main Page
    </a>

</body>
</html>
